name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android --project-name my_ai_app .

      - name: Set minSdk 26
        run: |
          sed -i 's/minSdk = .*/minSdk = 26/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
